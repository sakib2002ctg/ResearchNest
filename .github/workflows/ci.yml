name: ResearchNest v2 quality gates

on:
  push:
    branches: [main, master, "feat/**", "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: researchnest_migrations
          POSTGRES_USER: researchnest
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U researchnest -d researchnest_migrations"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_NAME: ResearchNest
      APP_ENV: test
      AI_DEFAULT_PROVIDER: offline
      API_RATE_LIMIT_ENABLED: "false"
      DOCUMENT_EMBEDDING_PROVIDER: hash
      DATABASE_URL: sqlite://
      TEST_MIGRATION_DATABASE_URL: postgresql://researchnest:ci-disposable-only@127.0.0.1:5432/researchnest_migrations
      TEST_IDENTITY_DATABASE_URL: postgresql://researchnest:ci-disposable-only@127.0.0.1:5432/researchnest_identity
      PGVECTOR_ENABLED: "true"
      SECRET_KEY: ci-only-not-a-deployment-credential
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m black --check --extend-exclude '(.cache)' .
      - run: python -m ruff check --config pyproject.toml ../scripts/verify_release.py
      - run: python -m black --check ../scripts/verify_release.py
      - name: Validate shell scripts
        run: |
          bash -n ../scripts/backup_db.sh ../scripts/restore_db.sh ../scripts/docker/init_db.sh
          python -m py_compile ../scripts/verify_release.py
      - name: Validate Compose without displaying secrets
        run: docker compose -f ../docker-compose.yml config --quiet
        env:
          SECRET_KEY: 8bd64ef127c0935a80cbd94953e17afc749a0bfe7c12ae8063d51da7acb4e8f0
          POSTGRES_PASSWORD: ci-only-bootstrap
          APP_DATABASE_PASSWORD: ci-only-runtime
          MIGRATION_DATABASE_PASSWORD: ci-only-migrator
          CORS_ORIGINS: '["https://research.invalid"]'
          NEXT_PUBLIC_API_BASE_URL: https://api.invalid/api/v1
      - name: Create isolated verification databases
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U researchnest researchnest_identity
          docker exec ${{ job.services.postgres.id }} createdb -U researchnest researchnest_alembic_check
          docker exec ${{ job.services.postgres.id }} createdb -U researchnest researchnest_role_check
      - name: Provision pgvector for isolated ORM test schemas
        # The discovery race test creates an isolated schema before the migration
        # round-trip test runs. Extensions belong to the database, not the server;
        # provisioning the separate Alembic/role databases does not cover this one.
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U researchnest
          -d researchnest_migrations -v ON_ERROR_STOP=1
          -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Verify real Redis atomic rate window
        run: |
          python - <<'PY'
          import asyncio
          from uuid import uuid4
          from redis.asyncio import Redis
          from app.middleware.rate_limit import SLIDING_WINDOW_SCRIPT
          async def check():
              client = Redis.from_url('redis://127.0.0.1:6379/0', socket_connect_timeout=2, socket_timeout=2)
              key = 'researchnest:ci:' + uuid4().hex
              try:
                  assert await client.eval(SLIDING_WINDOW_SCRIPT, 1, key, 60000, 1, uuid4().hex) == [1, 0]
                  blocked = await client.eval(SLIDING_WINDOW_SCRIPT, 1, key, 60000, 1, uuid4().hex)
                  assert blocked[0] == 0 and blocked[1] >= 1
                  assert await client.ttl(key) > 0
              finally:
                  await client.delete(key)
                  await client.aclose()
          asyncio.run(check())
          PY
      - name: Verify least-privilege bootstrap and production migration command
        run: |
          docker exec -i -e POSTGRES_USER -e POSTGRES_DB -e APP_DATABASE_PASSWORD -e MIGRATION_DATABASE_PASSWORD ${{ job.services.postgres.id }} bash < ../scripts/docker/init_db.sh
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          command = yaml.safe_load(Path('../docker-compose.yml').read_text())['services']['migrate']['command']
          subprocess.run(command, check=True)
          PY
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import DBAPIError
          engine = create_engine('postgresql://researchnest_app:ci-runtime@127.0.0.1:5432/researchnest_role_check')
          try:
              with engine.connect() as connection:
                  assert connection.execute(text('SELECT count(*) FROM users')).scalar_one() == 0
              for statement in ('CREATE TABLE forbidden_ddl (id int)', 'UPDATE audit_logs SET action=action', 'DELETE FROM audit_logs', 'UPDATE alembic_version SET version_num=version_num'):
                  with engine.connect() as connection:
                      try:
                          connection.execute(text(statement))
                      except DBAPIError:
                          connection.rollback()
                      else:
                          raise AssertionError('runtime role has forbidden privilege')
          finally:
              engine.dispose()
          PY
        env:
          POSTGRES_USER: researchnest
          POSTGRES_DB: researchnest_role_check
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: ci-disposable-only
          APP_DATABASE_PASSWORD: ci-runtime
          MIGRATION_DATABASE_PASSWORD: ci-migrator
          DATABASE_URL: postgresql://researchnest_migrator:ci-migrator@127.0.0.1:5432/researchnest_role_check
      - name: Verify empty PostgreSQL/pgvector upgrade and ORM alignment
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: postgresql://researchnest:ci-disposable-only@127.0.0.1:5432/researchnest_alembic_check
      - name: Full offline regression suite with coverage
        run: pytest --junitxml=.cache/ci-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            backend/coverage.xml
            backend/htmlcov/
            backend/.cache/ci-results.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NEXT_PUBLIC_API_BASE_URL: https://api.invalid/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
