name: Backend CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: researchnest_migrations
          POSTGRES_USER: researchnest
          POSTGRES_PASSWORD: migration-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchnest -d researchnest_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: ResearchNest
      DATABASE_URL: sqlite://
      TEST_MIGRATION_DATABASE_URL: postgresql://researchnest:migration-test@127.0.0.1:5432/researchnest_migrations
      SECRET_KEY: test-secret-key
      DEBUG: "true"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

      - name: Validate Compose configuration
        run: docker compose -f ../docker-compose.yml config --quiet

      - name: Verify pgvector is available
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U researchnest
          -d researchnest_migrations -v ON_ERROR_STOP=1
          -c 'CREATE EXTENSION vector;'

      - name: Run Tests with Coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/
