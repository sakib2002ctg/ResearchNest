services:
  db:
    image: postgres:17

    container_name: researchnest-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: researchnest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchnest"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: researchnest-backend:latest

    container_name: researchnest-backend

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./backend/.env.docker

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data: